<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống giám sát & điều khiển máy lọc nước RO</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fc; 
            margin: 0;
            padding: 0;
        }

        .analytics-report {
            max-width: 1200px;
            margin: 20px auto; 
            padding: 20px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        } 

        .dashboard-overview {
            display: flex;
            justify-content: space-between; 
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-card {
            flex: 1 1 200px;
            padding: 20px; 
            background-color: #f0f2f5;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        } 

        .stat-card h3 {
            margin: 0;
            font-size: 18px; 
            color: #333;
        }

        .stat-card p {
            font-size: 24px;
            color: #007bff; 
            font-weight: bold;
            margin: 10px 0 0 0;
        }

        .system-status-panel {
            background-color: #ffffff;
            border-radius: 12px; 
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border: 1px solid #e1e4e8;
        } 

        .system-status-panel h4 {
            margin-top: 0;
            font-size: 20px; 
            color: #333;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 15px;
        }

        .status-item {
            display: flex;
            align-items: center; 
            justify-content: space-between;
            padding: 12px 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border-left: 5px solid #ccc; 
            transition: all 0.3s ease;
        } 

        .status-led {
            width: 18px;
            height: 18px; 
            border-radius: 50%;
            display: inline-block;
            border: 1px solid #ccc;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        } 

        .led-white { background-color: #ffffff; box-shadow: 0 0 5px rgba(0,0,0,0.1); } 
        .led-green { background-color: #28a745; box-shadow: 0 0 10px #28a745; border-color: #28a745; } 

        .alarm-panel {
            background-color: #fff3f3;
            border: 2px solid #f5c6cb; 
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            color: #721c24;
            box-shadow: 0 4px 8px rgba(220, 53, 69, 0.1);
        } 

        .alarm-panel h4 {
            margin-top: 0;
            font-size: 20px; 
            color: #dc3545;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: blink 1.2s infinite;
        } 

        .alarm-list {
            margin: 0;
            padding-left: 25px; 
            font-size: 15px;
            font-weight: bold;
            line-height: 1.6;
        }

        @keyframes blink {
            0% { opacity: 1; } 
            50% { opacity: 0.5; } 
            100% { opacity: 1; } 
        }

        .charts-container {
            display: flex;
            flex-wrap: wrap; 
            gap: 20px;
            margin-bottom: 10px;
        }
        .chart-card {
            flex: 1 1 100%; 
            background-color: #ffffff;
            border-radius: 12px; 
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        } 

        .chart-card h4 {
            margin-bottom: 15px;
            font-size: 20px; 
            color: #333;
        }

        .chart-container {
            width: 100%;
            height: 350px; 
        }
    </style>
</head>
<body>
    <div class="analytics-report">
        
        <div class="dashboard-overview">
            <div class="stat-card" style="border-left: 4px solid #17a2b8;">
                <h3>Đo độ tinh khiết TDS đầu vào (TDS In)</h3>
                <p id="tds-in">0 PPM</p> 
            </div>
            <div class="stat-card" style="border-left: 4px solid #28a745;"> 
                <h3>Đo độ tinh khiết TDS Đầu ra (TDS Out)</h3>
                <p id="tds-out">0 PPM</p>
            </div>
        </div>

        <div class="system-status-panel">
            <h4>Trạng thái hoạt động hệ thống</h4>
            
            <div class="status-grid">
                <div class="status-item" id="item-pump">
                    <div>
                        <strong style="display:block;">Bơm nước đầu vào</strong>
                        <span id="text-pump-status" style="font-size:13px; color:#555;">Đang tắt</span> 
                    </div>
                    <span id="led-pump" class="status-led led-white"></span>
                </div>

                <div class="status-item" id="item-valve">
                    <div>
                        <strong style="display:block;">Van mở nước</strong>
                        <span id="text-valve-status" style="font-size:13px; color:#555;">Đang đóng</span> 
                    </div>
                    <span id="led-valve" class="status-led led-white"></span>
                </div>

                <div class="status-item" id="item-d115">
                    <div>
                        <strong style="display:block;">Trạng thái của máy</strong>
                        <span id="text-d115-status" style="font-size:13px; color:#555;">Đang tắt</span> 
                    </div>
                    <span id="led-d115" class="status-led led-white"></span>
                </div>
            </div>
        </div>

        <div class="alarm-panel" id="main-alarm-panel" style="display: none;">
            <h4>⚠️ PHÁT HIỆN SỰ CỐ HOẠT ĐỘNG HỆ THỐNG</h4> 
            <ul class="alarm-list" id="alarm-list-container"></ul>
        </div>

        <div class="charts-container">
            <div class="chart-card">
                <h4>Biểu đồ chỉ số nước TDS theo thời gian thực</h4>
                <div class="chart-container"> 
                    <canvas id="performance-chart"></canvas> 
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const ctxPerformance = document.getElementById('performance-chart').getContext('2d'); 
        const performanceChart = new Chart(ctxPerformance, {
            type: 'line', 
            data: {
                labels: [], 
                datasets: [
                    {
                        label: 'TDS In (Đầu vào - PPM)',
                        data: [], 
                        backgroundColor: 'rgba(0, 123, 255, 0.1)',
                        borderColor: 'rgba(0, 123, 255, 1)', 
                        borderWidth: 2, 
                        tension: 0.2,
                        pointRadius: 2
                    },
                    {
                        label: 'TDS Out (Đầu ra - PPM)',
                        data: [], 
                        backgroundColor: 'rgba(40, 167, 69, 0.1)',
                        borderColor: 'rgba(40, 167, 69, 1)', 
                        borderWidth: 2,
                        tension: 0.2,
                        pointRadius: 2
                    }
                ] 
            },
            options: {
                responsive: true,
                maintainAspectRatio: false, 
                animation: false,
                scales: {
                    y: { 
                        beginAtZero: true,
                        title: { display: true, text: 'Giá trị (PPM)' } 
                    },
                    x: {
                        title: { display: true, text: 'Thời gian hệ thống' }
                    }
                }
            }
        });
    </script>

    <script>
        let lastValidTdsIn = 0;
        let lastValidTdsOut = 0; 

        function fetchData() { 
            fetch('https://ro-water-monitor.onrender.com/data') 
                .then(response => response.json())
                .then(data => { 
                    console.log('Data received from ESP32:', data);
                    
                    if (data.d111 !== undefined && data.d111 !== null) { 
                        lastValidTdsOut = Number(data.d111);
                    }
                    if (data.d112 !== undefined && data.d112 !== null) { 
                        lastValidTdsIn = Number(data.d112);
                    }

                    document.getElementById('tds-in').innerText = lastValidTdsIn + " PPM"; 
                    document.getElementById('tds-out').innerText = lastValidTdsOut + " PPM";

                    const now = new Date();
                    const timeLabel = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0'); 

                    if (!isNaN(lastValidTdsIn) && !isNaN(lastValidTdsOut)) { 
                        performanceChart.data.labels.push(timeLabel);
                        performanceChart.data.datasets[0].data.push(lastValidTdsIn);  
                        performanceChart.data.datasets[1].data.push(lastValidTdsOut); 

                        if (performanceChart.data.labels.length > 20) {
                            performanceChart.data.labels.shift();
                            performanceChart.data.datasets[0].data.shift(); 
                            performanceChart.data.datasets[1].data.shift();
                        }
                        performanceChart.update();
                    }
                    
                    if (data.d113 !== undefined) {
                        const pumpLed = document.getElementById('led-pump'); 
                        const pumpText = document.getElementById('text-pump-status');
                        const pumpItem = document.getElementById('item-pump');

                        const valveLed = document.getElementById('led-valve');
                        const valveText = document.getElementById('text-valve-status'); 
                        const valveItem = document.getElementById('item-valve');
                        
                        if (Number(data.d113) === 1) {
                            pumpLed.className = "status-led led-green"; 
                            pumpLed.style.backgroundColor = "#28a745"; 
                            pumpText.innerText = "Đang hoạt động";
                            pumpItem.style.borderLeftColor = "#28a745";

                            valveLed.className = "status-led led-green";
                            valveLed.style.backgroundColor = "#28a745";
                            valveText.innerText = "Đang hoạt động (Mở)"; 
                            valveItem.style.borderLeftColor = "#28a745";
                        } else {
                            pumpLed.className = "status-led led-white"; 
                            pumpLed.style.backgroundColor = "#ffffff"; 
                            pumpText.innerText = "Đang tắt";
                            pumpItem.style.borderLeftColor = "#ccc";

                            valveLed.className = "status-led led-white";
                            valveLed.style.backgroundColor = "#ffffff";
                            valveText.innerText = "Đang đóng"; 
                            valveItem.style.borderLeftColor = "#ccc";
                        }
                    }

                    if (data.d114 !== undefined) {
                        const d114Led = document.getElementById('led-d115'); 
                        const d114Text = document.getElementById('text-d115-status');
                        const d114Item = document.getElementById('item-d115');
                        
                        if (Number(data.d114) === 1) {
                            d114Led.className = "status-led led-green"; 
                            d114Led.style.backgroundColor = "#28a745"; 
                            d114Text.innerText = "Đang bật";
                            d114Item.style.borderLeftColor = "#28a745";
                        } else {
                            d114Led.className = "status-led led-white"; 
                            d114Led.style.backgroundColor = "#ffffff"; 
                            d114Text.innerText = "Đang tắt";
                            d114Item.style.borderLeftColor = "#ccc";
                        }
                    }

                    let errorList = [];

                    if (data.d116 !== undefined && Number(data.d116) === 1) { 
                        errorList.push("Cảnh báo: Nguồn nước chưa đạt độ sạch tiêu chuẩn!");
                    }
                    if (data.d117 !== undefined && Number(data.d117) === 1) { 
                        errorList.push("Lỗi cảm biến: TDS đầu vào (TDS in) gặp sự cố!");
                    }
                    if (data.d118 !== undefined && Number(data.d118) === 1) { 
                        errorList.push("Lỗi cảm biến: TDS đầu ra (TDS out) gặp sự cố!");
                    }
                    if (data.d119 !== undefined && Number(data.d119) === 1) { 
                        errorList.push("Yêu cầu bảo trì: Thay màng lọc và kiểm tra máy bơm!");
                    }

                    const alarmPanel = document.getElementById('main-alarm-panel'); 
                    const alarmContainer = document.getElementById('alarm-list-container'); 

                    if (errorList.length > 0) {
                        alarmPanel.style.display = 'block';
                        alarmContainer.innerHTML = ''; 
                        errorList.forEach(errorMessage => {
                            alarmContainer.innerHTML += `<li>${errorMessage}</li>`;
                        });
                    } else {
                        alarmPanel.style.display = 'none'; 
                    }
                    
                }) 
                .catch(error => console.error('Error fetching data:', error));
        } 

        setInterval(fetchData, 5000); 
        fetchData(); 
    </script>
</body>
</html>
